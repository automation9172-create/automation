name: Generate and upload daily Shorts

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      privacy_status:
        description: YouTube visibility for this run
        required: true
        default: public
        type: choice
        options: [public, unlisted, private]

permissions:
  contents: write

concurrency:
  group: daily-shorts-${{ github.repository }}
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout LFS assets
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache LFS objects
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: shorts-lfs-${{ runner.os }}-${{ hashFiles('.gitattributes', 'assets/**/*.png', 'assets/**/*.mp3') }}

      - name: Materialize LFS assets
        run: |
          git lfs install --local
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" = "true" ]; then
            git lfs checkout
          else
            git lfs pull
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu

      - name: Install Python packages
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-short.txt pytest

      - name: Test isolated Shorts engine
        run: python -m pytest -q

      - name: Generate and upload five Shorts
        run: |
          PRIVACY="${{ inputs.privacy_status }}"
          if [ -z "$PRIVACY" ]; then PRIVACY=public; fi
          python -m shorts_engine.main --project-root . --count 5 --privacy-status "$PRIVACY" --upload

      - name: Save non-repetition history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .shorts_work
          git diff --cached --quiet || git commit -m "Update Shorts history"
          git push
